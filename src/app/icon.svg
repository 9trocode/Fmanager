<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>
  <!--
    Cairn — three stacked stones marking a path. Bottom is the
    widest and most grounded; middle balances slightly off-center
    to feel hand-stacked; top is the smallest, slightly tilted.
    Drawn as ellipses + a couple of paths to keep crisp at 16px.
  -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- bottom stone -->
  <ellipse cx="16" cy="24" rx="9" ry="3" fill="#fafafa"/>
  <!-- middle stone -->
  <ellipse cx="16.5" cy="18.5" rx="6.5" ry="2.6" fill="#fafafa"/>
  <!-- top stone — slight tilt via a rotated rounded shape -->
  <ellipse cx="16" cy="13.5" rx="4.2" ry="2.3" fill="#fafafa" transform="rotate(-6 16 13.5)"/>
</svg>
