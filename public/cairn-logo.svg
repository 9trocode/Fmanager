<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#g)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>
  <!-- bottom stone (widest, grounded) -->
  <ellipse cx="128" cy="190" rx="74" ry="22" fill="#FAFAF9"/>
  <!-- middle stone (slight off-center for hand-stacked feel) -->
  <ellipse cx="132" cy="142" rx="54" ry="20" fill="#F5F5F4"/>
  <!-- top stone (smallest, tilted) -->
  <ellipse cx="126" cy="92" rx="34" ry="18" fill="#FAFAF9" transform="rotate(-6 126 92)"/>
</svg>
